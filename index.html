
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>文明発展シミュレーション</title>
<style>
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#17251c;color:white;font-family:sans-serif;touch-action:none}
#game{width:100vw;height:100dvh}
#panel{position:absolute;top:12px;left:12px;padding:12px 16px;border-radius:12px;background:#17251ce8;pointer-events:none;min-width:190px}
#panel h2{margin:0 0 6px;font-size:16px}
#panel p{margin:3px 0;font-size:12px;color:#d4e2d3}
#help{position:absolute;bottom:14px;left:50%;transform:translateX(-50%);background:#17251cdd;padding:9px 13px;border-radius:10px;font-size:12px;white-space:nowrap;pointer-events:none}
#status{position:absolute;right:12px;top:12px;background:#17251ce8;padding:9px 12px;border-radius:10px;font-size:11px;color:#d4e2d3}
</style>
</head>
<body>
<div id="game"></div>
<div id="panel">
<h2>文明発展シミュレーション</h2>
<p>未開拓の大陸</p>
<p>地形生成システム 0.2</p>
<p id="worldInfo">世界を生成中...</p>
</div>
<div id="status">自然地形ワールド</div>
<div id="help">ドラッグ：視点回転　ピンチ：拡大・縮小　2本指ドラッグ：移動</div>

<script type="importmap">
{
 "imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
 }
}
</script>

<script type="module">
import * as THREE from "three";
import {OrbitControls} from "three/addons/controls/OrbitControls.js";

const container=document.getElementById("game");
const WORLD_SIZE=220;
const HALF=WORLD_SIZE/2;
const GRID=180;
const SEED=Math.floor(Math.random()*1000000000);

// 再現可能な乱数
function randomGenerator(seed){
 let s=seed>>>0;
 return function(){
  s=(s+0x6D2B79F5)|0;
  let t=Math.imul(s^(s>>>15),1|s);
  t^=t+Math.imul(t^(t>>>7),61|t);
  return ((t^(t>>>14))>>>0)/4294967296;
 };
}
const random=randomGenerator(SEED);

// シーン
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9bbbc7);
scene.fog=new THREE.Fog(0x9bbbc7,110,330);

const camera=new THREE.PerspectiveCamera(
 45,window.innerWidth/window.innerHeight,0.1,700
);
camera.position.set(65,75,85);

const renderer=new THREE.WebGLRenderer({
 antialias:true,
 powerPreference:"high-performance"
});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
renderer.setSize(window.innerWidth,window.innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;
controls.dampingFactor=0.065;
controls.maxPolarAngle=Math.PI/2.04;
controls.minDistance=12;
controls.maxDistance=230;
controls.target.set(0,0,0);

scene.add(new THREE.HemisphereLight(0xffffff,0x617052,2));

const sun=new THREE.DirectionalLight(0xfff2d9,2.1);
sun.position.set(-70,110,55);
scene.add(sun);

// 2次元ノイズ
function smooth(t){return t*t*(3-2*t)}
function hash(x,z){
 let n=Math.sin(x*127.1+z*311.7+SEED*0.001)*43758.5453;
 return n-Math.floor(n);
}
function noise(x,z,scale){
 x/=scale;z/=scale;
 const ix=Math.floor(x),iz=Math.floor(z);
 const fx=smooth(x-ix),fz=smooth(z-iz);
 const a=hash(ix,iz),b=hash(ix+1,iz);
 const c=hash(ix,iz+1),d=hash(ix+1,iz+1);
 return THREE.MathUtils.lerp(
  THREE.MathUtils.lerp(a,b,fx),
  THREE.MathUtils.lerp(c,d,fx),fz
 );
}
function fbm(x,z){
 return noise(x,z,55)*0.48+
        noise(x+31,z-17,27)*0.28+
        noise(x-12,z+43,13)*0.16+
        noise(x+8,z+8,6)*0.08;
}

// 大陸・島の配置
const continents=[
 {x:-48,z:-18,rx:59,rz:43},
 {x:45,z:32,rx:52,rz:39},
 {x:12,z:-72,rx:31,rz:24},
 {x:-87,z:66,rx:23,rz:27},
 {x:91,z:-65,rx:19,rz:24},
 {x:-5,z:91,rx:17,rz:15},
 {x:91,z:83,rx:12,rz:15}
];

function landScore(x,z){
 let best=-10;
 for(const c of continents){
  const dx=(x-c.x)/c.rx;
  const dz=(z-c.z)/c.rz;
  const score=1-dx*dx-dz*dz;
  best=Math.max(best,score);
 }
 return best+(fbm(x+300,z-200)-0.5)*0.35;
}

function isLand(x,z){
 return landScore(x,z)>0.02;
}

// 川の経路
function riverDistance(x,z,river){
 let best=999;
 for(let i=0;i<=80;i++){
  const t=i/80;
  const rz=river.startZ+(river.endZ-river.startZ)*t;
  const rx=river.centerX+
   Math.sin(t*Math.PI*river.bends+river.phase)*river.width;
  const d=Math.hypot(x-rx,z-rz);
  best=Math.min(best,d);
 }
 return best;
}
const rivers=[
 {centerX:-48,startZ:-62,endZ:25,width:13,bends:2.2,phase:0.5},
 {centerX:39,startZ:-8,endZ:83,width:12,bends:2.8,phase:1.3},
 {centerX:-80,startZ:45,endZ:88,width:7,bends:1.7,phase:2}
];

function riverAt(x,z){
 let distance=999;
 for(const river of rivers){
  distance=Math.min(distance,riverDistance(x,z,river));
 }
 return distance;
}

// 地形の高さ・種類
function terrainData(x,z){
 const score=landScore(x,z);
 const river=riverAt(x,z);
 const land=score>0.02;

 if(!land)return {land:false,height:-1.2,kind:"sea",river};

 const coast=THREE.MathUtils.clamp(score/0.32,0,1);
 const broad=fbm(x+500,z+500);
 const detail=noise(x,z,8);

 let height=0.5+coast*(
  2+broad*4+detail*1.3
 );

 // 山岳地帯
 const mountainZone=noise(x+800,z-400,46);
 if(mountainZone>0.57){
  const strength=(mountainZone-0.57)*22;
  height+=strength*coast;
 }
 height+=Math.max(0,broad-0.68)*20*coast;

 // 河川を地形に刻む
 const riverDepth=Math.exp(-Math.pow(river/2.8,2));
 height-=riverDepth*1.7;

 // 海岸の砂浜
 if(score<0.18)height=Math.min(height,0.65);

 let kind="plain";
 if(river<2.2)kind="river";
 else if(score<0.18)kind="beach";
 else if(height>12)kind="mountain";
 else if(height>6)kind="hill";
 else if(broad<0.28)kind="wetland";

 return {land:true,height,kind,river};
}

// 地形メッシュ生成
const geometry=new THREE.PlaneGeometry(
 WORLD_SIZE,WORLD_SIZE,GRID,GRID
);
geometry.rotateX(-Math.PI/2);

const positions=geometry.attributes.position;
const colors=[];
const heights=new Float32Array(positions.count);
const landFlags=new Uint8Array(positions.count);

const palette={
 sea:0x438ba8,
 beach:0xc8b77c,
 plain:0x789c58,
 hill:0x71845b,
 mountain:0x85877b,
 wetland:0x617f60,
 river:0x397f9e
};

for(let i=0;i<positions.count;i++){
 const x=positions.getX(i);
 const z=positions.getZ(i);
 const data=terrainData(x,z);

 positions.setY(i,data.height);
 heights[i]=data.height;
 landFlags[i]=data.land?1:0;

 let color=new THREE.Color(palette[data.kind]||palette.plain);
 const variation=0.94+noise(x+123,z-321,4)*0.12;
 color.multiplyScalar(variation);
 colors.push(color.r,color.g,color.b);
}

geometry.setAttribute(
 "color",new THREE.Float32BufferAttribute(colors,3)
);
geometry.computeVertexNormals();

const terrain=new THREE.Mesh(
 geometry,
 new THREE.MeshStandardMaterial({
  vertexColors:true,
  roughness:1,
  metalness:0
 })
);
scene.add(terrain);

// 海面
const ocean=new THREE.Mesh(
 new THREE.PlaneGeometry(500,500),
 new THREE.MeshStandardMaterial({
  color:0x438ba8,
  roughness:0.35,
  metalness:0.05
 })
);
ocean.rotation.x=-Math.PI/2;
ocean.position.y=-0.55;
scene.add(ocean);

// 湖
const lakes=[
 {x:-29,z:-3,rx:7,rz:5},
 {x:52,z:44,rx:8,rz:5},
 {x:6,z:-69,rx:5,rz:4}
];
const lakeMaterial=new THREE.MeshStandardMaterial({
 color:0x438eae,roughness:0.3
});
for(const lake of lakes){
 const mesh=new THREE.Mesh(
  new THREE.CircleGeometry(1,32),lakeMaterial
 );
 mesh.rotation.x=-Math.PI/2;
 mesh.position.set(lake.x,0.15,lake.z);
 mesh.scale.set(lake.rx,lake.rz,1);
 scene.add(mesh);
}

// 川の水面
const riverMaterial=new THREE.MeshStandardMaterial({
 color:0x438eae,roughness:0.3
});
for(const river of rivers){
 const points=[];
 for(let i=0;i<=80;i++){
  const t=i/80;
  const z=river.startZ+(river.endZ-river.startZ)*t;
  const x=river.centerX+
   Math.sin(t*Math.PI*river.bends+river.phase)*river.width;
  if(isLand(x,z)){
   const data=terrainData(x,z);
   points.push(new THREE.Vector3(x,data.height+0.06,z));
  }
 }
 if(points.length>1){
  const curve=new THREE.CatmullRomCurve3(points);
  const mesh=new THREE.Mesh(
   new THREE.TubeGeometry(curve,140,0.85,7,false),
   riverMaterial
  );
  scene.add(mesh);
 }
}

// 森林：InstancedMeshで軽量化
const trunkGeometry=new THREE.CylinderGeometry(0.13,0.19,1.2,5);
const leafGeometry=new THREE.ConeGeometry(0.85,2.5,6);
const trunkMaterial=new THREE.MeshStandardMaterial({color:0x705039});
const leafMaterial=new THREE.MeshStandardMaterial({color:0x315b35});

const treeTrunks=new THREE.InstancedMesh(
 trunkGeometry,trunkMaterial,1700
);
const treeLeaves=new THREE.InstancedMesh(
 leafGeometry,leafMaterial,1700
);
const dummy=new THREE.Object3D();
let treeCount=0;

for(let i=0;i<1700;i++){
 const x=(random()-0.5)*WORLD_SIZE;
 const z=(random()-0.5)*WORLD_SIZE;
 const data=terrainData(x,z);

 if(!data.land)continue;
 if(data.kind==="beach"||data.kind==="river")continue;
 if(data.height>13)continue;

 const forestNoise=fbm(x+900,z+700);
 if(forestNoise<0.35)continue;
 if(random()>0.78)continue;

 const scale=0.7+random()*0.65;
 const y=data.height;

 dummy.position.set(x,y+0.6*scale,z);
 dummy.scale.setScalar(scale);
 dummy.rotation.y=random()*Math.PI*2;
 dummy.updateMatrix();
 treeTrunks.setMatrixAt(treeCount,dummy.matrix);

 dummy.position.set(x,y+2*scale,z);
 dummy.scale.setScalar(scale);
 dummy.rotation.y=random()*Math.PI*2;
 dummy.updateMatrix();
 treeLeaves.setMatrixAt(treeCount,dummy.matrix);

 treeCount++;
}
treeTrunks.count=treeCount;
treeLeaves.count=treeCount;
scene.add(treeTrunks,treeLeaves);

// 遠景の雲
const cloudMaterial=new THREE.MeshStandardMaterial({
 color:0xffffff,transparent:true,opacity:0.65
});
for(let i=0;i<18;i++){
 const cloud=new THREE.Mesh(
  new THREE.SphereGeometry(1,8,6),cloudMaterial
 );
 cloud.scale.set(5+random()*8,1.2+random()*1.5,3+random()*5);
 cloud.position.set(
  (random()-0.5)*260,
  34+random()*15,
  (random()-0.5)*260
 );
 scene.add(cloud);
}

// 初期表示
camera.position.set(65,75,85);
controls.target.set(0,0,0);
document.getElementById("worldInfo").textContent=
 "生成シード："+SEED;

document.getElementById("status").textContent=
 "森林 "+treeCount+"本 / 地形生成完了";

function resize(){
 camera.aspect=window.innerWidth/window.innerHeight;
 camera.updateProjectionMatrix();
 renderer.setSize(window.innerWidth,window.innerHeight);
 renderer.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
}
window.addEventListener("resize",resize);

function animate(){
 requestAnimationFrame(animate);
 controls.update();
 renderer.render(scene,camera);
}
animate();

</script>
</body>
</html>
